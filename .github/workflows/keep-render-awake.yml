
name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render server
        env:
          TARGET_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "RENDER_URL is not configured"
            exit 1
          fi

          curl -fsS --max-time 30 "$TARGET_URL" \
            -o /dev/null
