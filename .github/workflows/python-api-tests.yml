name: Python API tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - "python-api/**"
      - ".github/workflows/python-api-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "python-api/**"
      - ".github/workflows/python-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-api
    env:
      JWT_SECRET: ci-only-test-secret-do-not-use-in-production-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "python-api/requirements.txt"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
